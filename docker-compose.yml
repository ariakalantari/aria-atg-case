name: atg-case

services:
  llm:
    # llama.cpp server, CPU only, pinned to the build we tested.
    # The first start downloads the model (about 1.3 GB) into the "models" volume.
    # --no-mmproj skips the model's image add-on (0.7 GB): we only send text.
    # Two slots (8k tokens each), so the report and the chat can use the model at the same time.
    image: ghcr.io/ggml-org/llama.cpp:server-b11382
    command: >-
      --hf-repo ${LLM_MODEL:-unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      --no-mmproj --ctx-size 16384 --parallel 2 --jinja
    environment:
      LLAMA_CACHE: /models
    volumes:
      - models:/models
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # this computer only, not the whole network (Claude mode costs money)
    env_file:
      - path: .env       # the Claude mode key, if you have one (see .env.example)
        required: false
    environment:
      LLM_URL: http://llm:8080
      LLM_MODEL: ${LLM_MODEL:-unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
    volumes:
      - cache:/app/cache
      - models:/models:ro   # read only, to show the first-start download progress
    depends_on:
      - llm
    restart: unless-stopped

volumes:
  models:
  cache:
